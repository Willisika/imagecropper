<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuvan suoristus</title>
<style>

  /* #FFFFFF #EEF0F9 #CED1EA #A3A9D2 #727BB0 #444466*/
  :root {
    --bg:        #EEF0F9;
    --bg-bar:    #CED1EA;
    --bg-panel:  #FFFFFF;
    --btn-active: #EEF0F9;
    --btn-disabled: #CED1EA;
    --btn-hover: #A3A9D2;
    --btn-save:  #685177;
    --btn-save-hover: #FFFFFF;
    --fg-text:   #313136;
    --fg-text-bright: #FFFFFF;
    --fg-muted:  #CED1EA;
    --fg-hint:   #444466;
    --fg-dark: #313136;
    --line:      #00D4FF;
    --point:     #FF6B35;
    --active:    #FFDD00;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    color: var(--fg-text);
    font-family: "Segoe UI", Tahoma, sans-serif;
    overflow: hidden;
  }
  #topbar {
    display: flex; align-items: center;
    background: var(--bg-bar);
    padding: 8px 12px;
    gap: 8px;
    height: 44px;
  }
  button {
    background: var(--btn-active);
    color: var(--fg-text);
    border: none;
    border-radius: 4px;
    padding: 8px 14px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
  }
  button:hover { 
    background: var(--btn-hover); 
    color: var(--fg-text-bright)}
  button.save {
    background: var(--btn-save);
    color: var(--fg-text-bright);
    font-weight: 600;
  }
  button.save:hover { background: var(--btn-save-hover); color: var(--fg-text)}
  button:disabled { opacity: 0.45; cursor: default; }
  button:disabled:hover { background: var(--bg-panel); color: var(--fg-muted) }
  #status {
    margin-left: auto;
    color: var(--fg-muted);
    font-size: 12px;
    white-space: nowrap;
    padding-right: 6px;
  }
  #main {
    display: flex;
    height: calc(100% - 44px);
    padding: 10px;
    gap: 10px;
  }
  #canvasWrap {
    flex: 1;
    background: var(--bg-panel);
    border-radius: 6px;
    overflow: hidden;
    position: relative;
    min-width: 0;
  }
  #canvas{ display: block;}
  #hint {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: var(--fg-hint);
    font-size: 18px;
    pointer-events: none;
  }
  #previewPanel {
    width: 25%;
    flex-shrink: 0;
    background: var(--bg-bar);
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .previewTitle {
    background: var(--bg-bar);
    color: var(--fg-text);
    font-size: 13px;
    font-weight: 600;
    padding: 10px 12px;
    border-bottom: 1px solid var(--fg-dark);
  }
  #previewBody {
    flex: 1;
    background: var(--bg-panel);
    margin: 12px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #previewCanvas { max-width: 100%; max-height: 100%; }
  #previewHint { color: var(--fg-hint); font-size: 13px; text-align: center; padding: 12px; }
  #previewInfo {
    color: var(--fg-muted);
    font-size: 11px;
    text-align: center;
    padding: 0 12px 12px;
  }
  #fileInput { display: none; }
</style>
</head>
<body>

<div id="topbar">
  <input type="file" id="fileInput" accept="image/*">
  <button id="btnOpen">📂 Avaa kuva</button>
  <button id="btnClear" disabled>🔄 Tyhjennä pisteet</button>
  <button id="btnSave" class="save" disabled>💾 Tallenna</button>
  <span id="status">Avaa kuva aloittaaksesi</span>
</div>

<div id="main">
  <div id="canvasWrap">
    <canvas id="canvas"></canvas>
    <div id="hint">Avaa kuva 📂<br>(tai raahaa se tähän)</div>
  </div>
  <div id="previewPanel">
    <div class="previewTitle">Esikatselu</div>
    <div id="previewBody">
      <div id="previewHint">Aseta 4 kulmapistettä<br>nähdäksesi esikatselun</div>
      <canvas id="previewCanvas" style="display:none;"></canvas>
    </div>
    <div id="previewInfo"></div>
  </div>
</div>

<script>
'use strict';

// ── Vakiot ───────────────────────────────────────────────────────────────
const POINT_RADIUS = 8;
const SNAP_RADIUS   = 14;
const LINE_COLOR    = '#00D4FF';
const POINT_COLOR   = '#FF6B35';
const ACTIVE_COLOR  = '#FFDD00';
const FILL_COLOR    = 'rgba(0, 212, 255, 0.25)';

// ── Homografia (vastaa cv2.getPerspectiveTransform + warpPerspective) ────
// Ratkaisee H:n s.e. to[i] = H(from[i]), muodossa [a,b,c,d,e,f,g,h] (i=1 kiinteä)
function solveHomography(from, to) {
  const A = [], B = [];
  for (let i = 0; i < 4; i++) {
    const [px, py] = from[i];
    const [qx, qy] = to[i];
    A.push([px, py, 1, 0, 0, 0, -px * qx, -py * qx]); B.push(qx);
    A.push([0, 0, 0, px, py, 1, -px * qy, -py * qy]); B.push(qy);
  }
  const n = 8;
  for (let col = 0; col < n; col++) {
    let pivot = col;
    for (let r = col + 1; r < n; r++) {
      if (Math.abs(A[r][col]) > Math.abs(A[pivot][col])) pivot = r;
    }
    [A[col], A[pivot]] = [A[pivot], A[col]];
    [B[col], B[pivot]] = [B[pivot], B[col]];
    const pivVal = A[col][col];
    for (let r = 0; r < n; r++) {
      if (r === col) continue;
      const factor = A[r][col] / pivVal;
      if (factor === 0) continue;
      for (let c = col; c < n; c++) A[r][c] -= factor * A[col][c];
      B[r] -= factor * B[col];
    }
  }
  const coef = B.map((b, i) => b / A[i][i]);
  return [...coef, 1];
}

function applyH(h, x, y) {
  const [a, b, c, d, e, f, g, hh] = h;
  const denom = g * x + hh * y + 1;
  return [(a * x + b * y + c) / denom, (d * x + e * y + f) / denom];
}

// Järjestää pisteet: vasen-ylä, oikea-ylä, oikea-ala, vasen-ala (kuten Pythonin order_points)
function orderPoints(pts) {
  const s    = pts.map(p => p[0] + p[1]);
  const diff = pts.map(p => p[1] - p[0]);
  const tl = pts[s.indexOf(Math.min(...s))];
  const br = pts[s.indexOf(Math.max(...s))];
  const tr = pts[diff.indexOf(Math.min(...diff))];
  const bl = pts[diff.indexOf(Math.max(...diff))];
  return [tl, tr, br, bl];
}

function dist(a, b) { return Math.hypot(a[0] - b[0], a[1] - b[1]); }

function bilinearSample(data, w, h, x, y) {
  if (x < 0 || y < 0 || x > w - 1 || y > h - 1) return [0, 0, 0, 255];
  const x0 = Math.floor(x), y0 = Math.floor(y);
  const x1 = Math.min(x0 + 1, w - 1), y1 = Math.min(y0 + 1, h - 1);
  const fx = x - x0, fy = y - y0;
  const out = [0, 0, 0, 255];
  for (let c = 0; c < 3; c++) {
    const p00 = data[(y0 * w + x0) * 4 + c];
    const p10 = data[(y0 * w + x1) * 4 + c];
    const p01 = data[(y1 * w + x0) * 4 + c];
    const p11 = data[(y1 * w + x1) * 4 + c];
    const top = p00 * (1 - fx) + p10 * fx;
    const bot = p01 * (1 - fx) + p11 * fx;
    out[c] = top * (1 - fy) + bot * fy;
  }
  return out;
}

// pts: 4 pistettä alkuperäisen kuvan koordinaateissa (jo skaalan/offsetin poistettuna)
function warpImage(srcData, srcW, srcH, pts) {
  const ordered = orderPoints(pts);
  const [tl, tr, br, bl] = ordered;
  const wA = dist(br, bl), wB = dist(tr, tl);
  const hA = dist(tr, br), hB = dist(tl, bl);
  const W = Math.max(Math.trunc(wA), Math.trunc(wB));
  const H = Math.max(Math.trunc(hA), Math.trunc(hB));
  if (W < 1 || H < 1) return null;

  const dstRect = [[0, 0], [W - 1, 0], [W - 1, H - 1], [0, H - 1]];
  const Hm = solveHomography(dstRect, ordered);
  const out = new Uint8ClampedArray(W * H * 4);
  for (let Y = 0; Y < H; Y++) {
    for (let X = 0; X < W; X++) {
      const [sx, sy] = applyH(Hm, X, Y);
      const [r, g, b, a] = bilinearSample(srcData, srcW, srcH, sx, sy);
      const idx = (Y * W + X) * 4;
      out[idx] = r; out[idx + 1] = g; out[idx + 2] = b; out[idx + 3] = a;
    }
  }
  return { imageData: new ImageData(out, W, H), width: W, height: H };
}

function fitToBox(w, h, maxW, maxH) {
  const scale = Math.min(maxW / w, maxH / h, 1.0);
  return [Math.round(w * scale), Math.round(h * scale), scale];
}

// ── Sovellus ─────────────────────────────────────────────────────────────
const canvas       = document.getElementById('canvas');
const ctx          = canvas.getContext('2d');
const canvasWrap    = document.getElementById('canvasWrap');
const hint         = document.getElementById('hint');
const previewCanvas = document.getElementById('previewCanvas');
const previewCtx    = previewCanvas.getContext('2d');
const previewHint   = document.getElementById('previewHint');
const previewInfo   = document.getElementById('previewInfo');
const statusEl      = document.getElementById('status');
const fileInput     = document.getElementById('fileInput');
const btnOpen       = document.getElementById('btnOpen');
const btnClear      = document.getElementById('btnClear');
const btnSave       = document.getElementById('btnSave');

let img          = null;   // HTMLImageElement, täysi resoluutio
let srcData      = null;   // Uint8ClampedArray täysin resoluutioisesta kuvasta (cachettu)
let srcW = 0, srcH = 0;
let scale        = 1.0;    // alkuperäinen -> canvas
let offsetX = 0, offsetY = 0;
let points       = [];     // [[x,y], ...] canvas-koordinaateissa
let dragIdx      = null;
let fileName     = 'kuva.png';

function setStatus(msg) { statusEl.textContent = msg; }

function resizeCanvasToWrap() {
  const rect = canvasWrap.getBoundingClientRect();
  canvas.width  = Math.max(Math.floor(rect.width), 50);
  canvas.height = Math.max(Math.floor(rect.height), 50);
}

function loadImage(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    const image = new Image();
    image.onload = () => {
      img = image;
      srcW = image.naturalWidth;
      srcH = image.naturalHeight;
      // Cachetaan täysresoluutioinen pikselidata (ImageData) warppausta varten
      const off = document.createElement('canvas');
      off.width = srcW; off.height = srcH;
      const offCtx = off.getContext('2d');
      offCtx.drawImage(image, 0, 0);
      srcData = offCtx.getImageData(0, 0, srcW, srcH).data;

      fileName = file.name.replace(/\.[^.]+$/, '') + '_cropped.png';
      points = [];
      hint.style.display = 'none';
      btnClear.disabled = false;
      btnSave.disabled = true;
      resetPreview();
      renderCanvas();
      setStatus(`Klikkaa 4 kulmapistettä — ${file.name}`);
    };
    image.onerror = () => setStatus('Kuvan lataus epäonnistui');
    image.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function renderCanvas() {
  if (!img) return;
  if (points.length < 4)
    canvas.style.cursor = "crosshair";
  else 
    canvas.style.cursor = "auto";
  resizeCanvasToWrap();
  const cw = canvas.width, ch = canvas.height;
  const [dw, dh, s] = fitToBox(srcW, srcH, cw - 20, ch - 20);
  scale = s;
  offsetX = Math.round((cw - dw) / 2);
  offsetY = Math.round((ch - dh) / 2);

  ctx.clearRect(0, 0, cw, ch);
  ctx.drawImage(img, offsetX, offsetY, dw, dh);
  drawOverlay();
}

function drawOverlay() {
  const n = points.length;
  if (n === 0) return;

  if (n >= 2) {
    ctx.strokeStyle = LINE_COLOR;
    ctx.lineWidth = 2;
    for (let i = 0; i < n - 1; i++) {
      ctx.beginPath();
      ctx.moveTo(points[i][0], points[i][1]);
      ctx.lineTo(points[i + 1][0], points[i + 1][1]);
      ctx.stroke();
    }
  }
  if (n === 4) {
    ctx.beginPath();
    ctx.moveTo(points[3][0], points[3][1]);
    ctx.lineTo(points[0][0], points[0][1]);
    ctx.stroke();

    ctx.fillStyle = FILL_COLOR;
    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    for (let i = 1; i < 4; i++) ctx.lineTo(points[i][0], points[i][1]);
    ctx.closePath();
    ctx.fill();
  }

  points.forEach(([x, y], i) => {
    ctx.beginPath();
    ctx.arc(x, y, POINT_RADIUS, 0, Math.PI * 2);
    ctx.fillStyle = (i === dragIdx) ? ACTIVE_COLOR : POINT_COLOR;
    ctx.fill();
    ctx.strokeStyle = '#FFFFFF';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = '#FFFFFF';
    ctx.font = 'bold 11px "Segoe UI"';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(i + 1), x, y);
  });
}

function canvasPointToImagePoint([x, y]) {
  return [(x - offsetX) / scale, (y - offsetY) / scale];
}

function getWarped() {
  if (points.length < 4 || !srcData) return null;
  const imgPts = points.map(canvasPointToImagePoint);
  return warpImage(srcData, srcW, srcH, imgPts);
}

function resetPreview() {
  previewCanvas.style.display = 'none';
  previewHint.style.display = 'block';
  previewInfo.textContent = '';
}

function updatePreview() {
  const result = getWarped();
  if (!result) { resetPreview(); return; }
  previewCanvas.width = result.width;
  previewCanvas.height = result.height;
  previewCtx.putImageData(result.imageData, 0, 0);
  previewCanvas.style.display = 'block';
  previewHint.style.display = 'none';
  previewInfo.textContent = `${result.width} × ${result.height} px`;
  btnSave.disabled = false;
}

// ── Hiiri-/kosketustapahtumat ──────────────────────────────────────────────

function pointerPos(e) {
  const rect = canvas.getBoundingClientRect();
  return [e.clientX - rect.left, e.clientY - rect.top];
}

canvas.addEventListener('pointerdown', (e) => {
  if (!img) {
    fileInput.click()
  }
  const [x, y] = pointerPos(e);

  for (let i = 0; i < points.length; i++) {
    const [px, py] = points[i];
    if (Math.abs(px - x) <= SNAP_RADIUS && Math.abs(py - y) <= SNAP_RADIUS) {
      dragIdx = i;
      canvas.setPointerCapture(e.pointerId);
      drawOverlayOnly();
      return;
    }
  }

  if (points.length < 4) {
    points.push([x, y]);
    drawOverlayOnly();
    if (btnClear.disabled) {
      btnClear.disabled = false
    }
    const n = points.length;
    if (n < 4) {
      setStatus(`Piste ${n}/4 asetettu — klikkaa seuraava kulma`);
    } else {
      setStatus('Kaikki pisteet asetettu — vedä siirtääksesi, tai tallenna');
      updatePreview();
    }
  }
});

canvas.addEventListener('pointermove', (e) => {
  if (dragIdx === null) return;
  const [x, y] = pointerPos(e);
  points[dragIdx] = [x, y];
  drawOverlayOnly();
  updatePreview();
});

canvas.addEventListener('pointerup', (e) => {
  if (dragIdx !== null) {
    canvas.releasePointerCapture(e.pointerId);
  }
  dragIdx = null;
});

function drawOverlayOnly() {
  renderCanvas();
}

// ── Napit ────────────────────────────────────────────────────────────────

btnOpen.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
  if (fileInput.files.length) loadImage(fileInput.files[0]);
  fileInput.value = '';
});

btnClear.addEventListener('click', () => {
  points = [];
  dragIdx = null;
  renderCanvas();
  resetPreview();
  btnSave.disabled = true;
  btnClear.disabled = true;
  setStatus('Pisteet tyhjennetty — klikkaa 4 uutta kulmapistettä');
});

btnSave.addEventListener('click', () => {
  const result = getWarped();
  if (!result) return;
  const off = document.createElement('canvas');
  off.width = result.width; off.height = result.height;
  off.getContext('2d').putImageData(result.imageData, 0, 0);
  off.toBlob((blob) => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    setStatus(`Tallennettu: ${fileName} (${result.width}×${result.height} px)`);
  }, 'image/png');
});

// ── Raahaa & pudota ─────────────────────────────────────────────────────
['dragover'].forEach(ev => canvasWrap.addEventListener(ev, (e) => e.preventDefault()));
canvasWrap.addEventListener('drop', (e) => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) loadImage(file);
});

// ── Ikkunan koon muutos ──────────────────────────────────────────────────
let resizeTimer = null;
window.addEventListener('resize', () => {
  if (!img) return;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    // Muunnetaan pisteet alkuperäisiksi kuvakoordinaateiksi ennen uudelleenpiirtoa
    const origPts = points.map(canvasPointToImagePoint);
    renderCanvas();
    points = origPts.map(([x, y]) => [x * scale + offsetX, y * scale + offsetY]);
    drawOverlayOnly();
  }, 80);
});

resizeCanvasToWrap();
</script>
</body>
</html>
